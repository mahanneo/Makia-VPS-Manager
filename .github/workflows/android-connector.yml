name: Android Connector UAT Build

on:
  pull_request:
    paths:
      - "client/android/**"
      - "app/client_connector.py"
      - "app/client_portal.py"
      - "app/static/client.js"
      - "app/templates/client_app.html"
      - ".github/workflows/android-connector.yml"
      - "VERSION"
  push:
    branches:
      - "main"
    paths:
      - "client/android/**"
      - "app/client_connector.py"
      - "app/client_portal.py"
      - "app/static/client.js"
      - "app/templates/client_app.html"
      - ".github/workflows/android-connector.yml"
      - "VERSION"
  workflow_dispatch:

concurrency:
  group: android-connector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: makia

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"

      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.0.13004108" "platforms;android-37.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Checkout pinned official SFA and sing-box
        shell: bash
        run: |
          mkdir -p upstream
          git clone https://github.com/SagerNet/sing-box-for-android.git upstream/sing-box-for-android
          git -C upstream/sing-box-for-android checkout a3668ae6e4bbcb3ceff8461d0cac55d79edf504f
          git clone --branch v1.14.1 --depth 1 https://github.com/SagerNet/sing-box.git upstream/sing-box
          test "$(git -C upstream/sing-box-for-android rev-parse HEAD)" = "a3668ae6e4bbcb3ceff8461d0cac55d79edf504f"
          test "$(git -C upstream/sing-box describe --tags --exact-match)" = "v1.14.1"

      - name: Install pinned gomobile toolchain
        shell: bash
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          test -x "$(go env GOPATH)/bin/gomobile"
          test -x "$(go env GOPATH)/bin/gobind"

      - name: Bundle pinned Wstunnel Android ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          version=11.0.0
          archive="wstunnel_${version}_android_arm64.tar.gz"
          expected="9618838a4c3da6b53a4f6d67d24504b2a9aad14716387ca4c3d4cc53d861dcb4"
          curl -fsSL --retry 3 "https://github.com/erebe/wstunnel/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          echo "${expected}  /tmp/${archive}" | sha256sum -c -
          rm -rf /tmp/makia-wstunnel-android && mkdir -p /tmp/makia-wstunnel-android
          tar -xzf "/tmp/${archive}" -C /tmp/makia-wstunnel-android
          binary="$(find /tmp/makia-wstunnel-android -type f -name wstunnel | head -n1)"
          test -n "$binary"
          mkdir -p upstream/sing-box-for-android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 "$binary" upstream/sing-box-for-android/app/src/main/jniLibs/arm64-v8a/libwstunnel.so

      - name: Build official libbox Android AAR
        shell: bash
        working-directory: upstream/sing-box
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p ../sing-box-for-android/app/libs
          go run ./cmd/internal/build_libbox -target android
          test -s ../sing-box-for-android/app/libs/libbox.aar
          test -s ../sing-box-for-android/app/libs/libbox-legacy.aar

      - name: Apply Makia overlay
        shell: bash
        run: |
          python makia/client/android/patch_sfa.py upstream/sing-box-for-android makia/client/android/MakiaEntryActivity.kt
          grep -q 'applicationId = "com.makia.client"' upstream/sing-box-for-android/app/build.gradle.kts
          grep -q '^VERSION_NAME=1.6.4$' upstream/sing-box-for-android/version.properties
          grep -q '^VERSION_CODE=10604$' upstream/sing-box-for-android/version.properties
          grep -q 'android:scheme="makia"' upstream/sing-box-for-android/app/src/main/AndroidManifest.xml

      - name: Build installable Android UAT APK
        shell: bash
        working-directory: upstream/sing-box-for-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOtherDebug

      - name: Collect and validate Android package
        shell: bash
        run: |
          set -euo pipefail
          out=upstream/sing-box-for-android/app/build/outputs/apk/other/debug
          mkdir -p package-android/advanced
          find "$out" -type f -name '*.apk' -print
          universal=$(find "$out" -maxdepth 1 -type f -name '*-universal-debug.apk' | head -n 1)
          test -n "$universal"
          cp "$universal" package-android/Makia-Android-Connector.apk
          find "$out" -maxdepth 1 -type f -name '*.apk' ! -name '*-universal-debug.apk' -exec cp {} package-android/advanced/ \;
          cp makia/client/android/README-GPL.md package-android/
          cp makia/client/android/INSTALL.txt package-android/
          cp makia/client/android/MakiaEntryActivity.kt package-android/
          cp makia/client/android/patch_sfa.py package-android/
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "makia_version=1.6.4"
            echo "signing=debug-uat"
          } > package-android/BUILD-INFO.txt
          python - <<'PY'
          from pathlib import Path
          apk=Path("package-android/Makia-Android-Connector.apk")
          data=apk.read_bytes()
          if b"APK Sig Block 42" not in data:
              raise SystemExit("APK signing block missing")
          if apk.stat().st_size < 10_000_000:
              raise SystemExit("APK unexpectedly small")
          print(f"Validated APK: {apk.name} ({apk.stat().st_size} bytes)")
          PY
          unzip -l package-android/Makia-Android-Connector.apk | grep -q 'lib/arm64-v8a/libbox.so'
          unzip -l package-android/Makia-Android-Connector.apk | grep -q 'lib/arm64-v8a/libwstunnel.so'
          (cd package-android && find . -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          test -s package-android/SHA256SUMS.txt
          cat package-android/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Makia-Android-Connector-1.6.4-UAT
          path: package-android/
          if-no-files-found: error
          retention-days: 90
