<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="application-name" content="Makia VPS Manager">
  <title>{{app_name}}</title>
  <link rel="manifest" href="/static/manifest.webmanifest?v={{version}}">
  <link rel="icon" href="/static/makia.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{version}}">
</head>
<body class="makia-pro-shell" data-theme="{{theme}}" data-density="{{density}}">
  <aside class="pro-sidebar" id="sidebar">
    <div class="pro-brand">
      <img src="/static/makia.svg" alt="">
      <div><strong>MAKIA</strong><span>VPS MANAGER</span></div>
      <button class="sidebar-mobile-close" type="button" data-shell-action="sidebar-close" aria-label="بستن منو">×</button>
    </div>

    <button class="pro-create-access" type="button" data-shell-action="create-access">
      <span>＋</span><div><b>ساخت دسترسی</b><small>Core access · Connection Modes</small></div>
    </button>

    <nav class="pro-nav" aria-label="منوی اصلی پنل">
      <p>اصلی</p>
      <button data-view="dashboard" class="active"><span class="pro-nav-icon">⌂</span><b>داشبورد</b></button>
      <button data-view="access"><span class="pro-nav-icon">♙</span><b>کاربران</b><em>همه دسترسی‌ها</em></button>

      <p>پروتکل‌ها</p>
      <div class="pro-nav-group open" data-group-root="protocols">
        <button class="pro-group-toggle" type="button" data-shell-action="sidebar-group" data-group="protocols"><span class="pro-nav-icon">◫</span><b>مدیریت پروتکل‌ها</b><i>⌄</i></button>
        <div class="pro-submenu" data-group-panel="protocols">
          <button data-view="modes"><span class="proto-dot inbound"></span><b>Connection Modes</b></button>
          <button data-view="xray"><span class="proto-dot xray"></span><b>Xray / V2Ray</b></button>
          <button data-view="inbounds"><span class="proto-dot inbound"></span><b>Inboundها</b></button>
          <button data-view="ssh"><span class="proto-dot ssh"></span><b>SSH / NPV</b></button>
          <button data-view="wireguard"><span class="proto-dot wg"></span><b>WireGuard</b></button>
          <button data-view="openvpn"><span class="proto-dot ovpn"></span><b>OpenVPN</b></button>
        </div>
      </div>

      <p>زیرساخت</p>
      <div class="pro-nav-group" data-group-root="infra">
        <button class="pro-group-toggle" type="button" data-shell-action="sidebar-group" data-group="infra"><span class="pro-nav-icon">▦</span><b>سرور و شبکه</b><i>⌄</i></button>
        <div class="pro-submenu" data-group-panel="infra">
          <button data-view="services"><span>•</span><b>سرویس‌ها</b></button>
          <button data-view="protocols"><span>•</span><b>شبکه و پورت‌ها</b></button>
          <button data-view="sessions"><span>•</span><b>اتصال‌های زنده</b></button>
          <button data-view="nodes"><span>•</span><b>نودها</b></button>
          <button data-view="connectivity"><span>•</span><b>Connectivity Lab</b></button>
        </div>
      </div>

      <p>سیستم</p>
      <div class="pro-nav-group" data-group-root="system">
        <button class="pro-group-toggle" type="button" data-shell-action="sidebar-group" data-group="system"><span class="pro-nav-icon">⌘</span><b>نگهداری</b><i>⌄</i></button>
        <div class="pro-submenu" data-group-panel="system">
          <button data-view="audit"><span>•</span><b>لاگ‌ها</b></button>
          <button data-view="backups"><span>•</span><b>بکاپ</b></button>
          <button data-view="updates"><span>•</span><b>بروزرسانی</b></button>
        </div>
      </div>

      <button data-view="settings"><span class="pro-nav-icon">⚙</span><b>تنظیمات</b></button>
      <button data-view="support"><span class="pro-nav-icon">?</span><b>پشتیبانی</b></button>
    </nav>

    <div class="pro-sidebar-footer">
      <div class="server-health"><i></i><div><b>Server online</b><small>{{ panel_domain or 'IP Mode' }}</small></div></div>
      <div class="footer-meta"><span>v{{version}}</span><form action="/logout" method="post"><button type="submit">خروج ↪</button></form></div>
    </div>
  </aside>

  <main class="pro-main">
    <header class="pro-topbar">
      <div class="pro-topbar-right">
        <button class="mobile-menu-toggle" type="button" data-shell-action="sidebar-open" aria-label="باز کردن منو">☰</button>
        <button class="global-command" type="button" data-shell-action="command"><span>⌕</span><b>جستجو در پنل...</b><kbd>Ctrl K</kbd></button>
      </div>
      <div class="pro-topbar-left">
        <span class="top-server-state"><i></i>ONLINE</span>
        <button class="top-refresh" type="button" data-shell-action="refresh" title="بروزرسانی">↻</button>
        <div class="top-user"><span>{{ (current_username or 'A')[:1]|upper }}</span><div><b>{{current_username or 'admin'}}</b><small>Administrator</small></div></div>
      </div>
    </header>

    <div class="compat-page-meta" aria-hidden="true"><span id="pageContext">MAKIA CONTROL CENTER</span><span id="pageTitle">Dashboard</span></div>
    <section id="content" class="pro-content" aria-live="polite"></section>
  </main>

  <div id="modalRoot"></div>
  <script>
    window.MAKIA_VERSION='{{version}}';
    window.MAKIA_LANG='{{language}}';
    window.PANEL_DOMAIN='{{panel_domain}}';
    window.MAKIA_THEME='{{theme}}';
    window.MAKIA_DENSITY='{{density}}';
    window.MAKIA_USER='{{current_username or "admin"}}';
  </script>
  <script src="/static/app.js?v={{version}}"></script>
</body>
</html>
