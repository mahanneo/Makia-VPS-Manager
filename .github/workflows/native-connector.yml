name: Windows Full Device Connector Build

on:
  pull_request:
    paths:
      - "client/windows/**"
      - "app/client_connector.py"
      - "app/client_portal.py"
      - "app/protocol_ops.py"
      - "app/static/client.js"
      - "app/templates/client_app.html"
      - ".github/workflows/native-connector.yml"
      - "VERSION"
  push:
    branches: ["main"]
    paths:
      - "client/windows/**"
      - "app/client_connector.py"
      - "app/client_portal.py"
      - "app/protocol_ops.py"
      - "app/static/client.js"
      - "app/templates/client_app.html"
      - ".github/workflows/native-connector.yml"
      - "VERSION"
  workflow_dispatch:

concurrency:
  group: windows-connector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-connector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Connector syntax and regression tests
        shell: pwsh
        run: |
          python -m py_compile client/windows/makia_client_connector.py client/windows/makia_windows.py client/windows/test_connector.py client/windows/test_windows_gui.py app/client_connector.py app/client_portal.py
          python -m unittest client.windows.test_connector client.windows.test_windows_gui
          $guiHealth=(python client/windows/makia_windows.py --healthcheck | ConvertFrom-Json)
          if (!$guiHealth.ok -or $guiHealth.password_stored -or $guiHealth.portal -ne 'https://p.mahinet.shop/client/') { throw 'Native launcher self-test failed' }
          node --check app/static/client.js

      - name: Build Windows full-device connector
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
          pyinstaller --noconfirm --clean --onefile --name MakiaClientConnector --uac-admin client/windows/makia_client_connector.py
          pyinstaller --noconfirm --clean --onefile --windowed --name MakiaWindows client/windows/makia_windows.py

      - name: Fetch pinned sing-box 1.14.2
        shell: pwsh
        run: |
          $url="https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-windows-amd64.zip"
          $zip="$env:RUNNER_TEMP\sing-box.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32") { throw "sing-box checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force
          $bin=Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (!$bin) { throw "sing-box.exe not found" }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\MakiaClientConnector.exe package\MakiaClientConnector.exe
          Copy-Item dist\MakiaWindows.exe package\MakiaWindows.exe
          Copy-Item $bin.FullName package\sing-box.exe
          Copy-Item client\windows\install.ps1 package\install.ps1
          Copy-Item client\windows\uninstall.ps1 package\uninstall.ps1
          Copy-Item client\windows\Install-Makia.cmd package\Install-Makia.cmd
          Copy-Item client\windows\Uninstall-Makia.cmd package\Uninstall-Makia.cmd
          Copy-Item client\windows\INSTALL.txt package\INSTALL.txt

      - name: Fetch pinned wstunnel 11.0.0
        shell: pwsh
        run: |
          $url="https://github.com/erebe/wstunnel/releases/download/v11.0.0/wstunnel_11.0.0_windows_amd64.tar.gz"
          $archive="$env:RUNNER_TEMP\wstunnel.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "024323c9c2dd1ed1c6f38d417d9b2776e2f0083bba507e80d4a8124c8451b164") { throw "wstunnel checksum mismatch: $hash" }
          $dir="$env:RUNNER_TEMP\wstunnel"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          tar.exe -xzf $archive -C $dir
          $bin=Get-ChildItem $dir -Recurse -Filter "wstunnel.exe" | Select-Object -First 1
          if (!$bin) { throw "wstunnel.exe not found" }
          Copy-Item $bin.FullName package\wstunnel.exe
          package\wstunnel.exe --version

      - name: Smoke package and real installer
        shell: pwsh
        run: |
          package\MakiaClientConnector.exe --status
          if ($LASTEXITCODE -ne 0) { throw "connector status smoke failed" }
          package\sing-box.exe version
          $launcher=Start-Process -FilePath (Resolve-Path package\MakiaWindows.exe).Path -ArgumentList '--healthcheck' -Wait -PassThru
          if ($launcher.ExitCode -ne 0) { throw 'Windows GUI launcher healthcheck failed' }

          $oldLocal=$env:LOCALAPPDATA
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP "makia-windows-smoke"
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File package\install.ps1 -SourceDir (Resolve-Path package).Path
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }

            $installed=Join-Path $env:LOCALAPPDATA "Makia\Connector\bin\MakiaClientConnector.exe"
            $runtime=Join-Path $env:LOCALAPPDATA "Makia\Connector\bin\sing-box.exe"
            $ws=Join-Path $env:LOCALAPPDATA "Makia\Connector\bin\wstunnel.exe"
            if (!(Test-Path $installed) -or !(Test-Path $runtime) -or !(Test-Path $ws)) { throw "installed Windows runtime incomplete" }
            $probe=(package\MakiaClientConnector.exe --self-test | ConvertFrom-Json)
            if (!$probe.ok -or !$probe.sing_box -or !$probe.wstunnel) { throw "connector self-test missing runtime" }

            $registered=(Get-Item "HKCU:\Software\Classes\makia\shell\open\command").GetValue("")
            if ([string]::IsNullOrWhiteSpace($registered) -or !$registered.Contains("MakiaClientConnector.exe") -or !$registered.Contains("%1")) {
              throw "makia:// registration invalid: $registered"
            }
          }
          finally {
            Remove-Item -Recurse -Force "HKCU:\Software\Classes\makia" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $env:LOCALAPPDATA -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA=$oldLocal
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          @(
            "panel_version=1.6.5"
            "windows_client_version=1.6.5.1"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "run_id=$env:GITHUB_RUN_ID"
          ) | Set-Content -Encoding ascii package\BUILD-INFO.txt
          $lines=Get-ChildItem package -File | Sort-Object Name | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii package\SHA256SUMS.txt
          Get-Content package\SHA256SUMS.txt

      - name: Build single-file Windows Setup and test install/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install innosetup --version 6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            $found=Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($found) { $iscc=$found.Source }
          }
          if (!(Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc 'client\windows\setup.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Setup compilation failed' }
          $setup=(Resolve-Path 'installer\Makia-Windows-Setup-1.6.5.1-x64.exe').Path
          if ((Get-Item $setup).Length -lt 1000000) { throw 'Installer unexpectedly small' }
          $log=Join-Path $env:RUNNER_TEMP 'makia-setup-smoke.log'
          $install=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',("/LOG=`"$log`"")) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "One-click setup failed: $($install.ExitCode)" }
          $appDir=Join-Path $env:LOCALAPPDATA 'Makia\Connector\bin'
          foreach ($name in @('MakiaWindows.exe','MakiaClientConnector.exe','sing-box.exe','wstunnel.exe')) {
            if (!(Test-Path (Join-Path $appDir $name))) { throw "Installer missing $name" }
          }
          $entry=(Get-Item 'HKCU:\Software\Classes\makia\shell\open\command').GetValue('')
          if ($entry -notlike '*MakiaClientConnector.exe*' -or $entry -notlike '*"%1"*') { throw 'makia:// handler invalid' }
          $health=Start-Process -FilePath (Join-Path $appDir 'MakiaWindows.exe') -ArgumentList '--healthcheck' -Wait -PassThru
          if ($health.ExitCode -ne 0) { throw 'Installed GUI self-test failed' }
          $uninstall=Join-Path $appDir 'unins000.exe'
          if (!(Test-Path $uninstall)) { throw 'Windows uninstaller missing' }
          $result=Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Windows uninstall failed: $($result.ExitCode)" }
          if (Test-Path (Join-Path $appDir 'MakiaWindows.exe')) { throw 'Windows uninstaller left executable behind' }
          if (Test-Path 'HKCU:\Software\Classes\makia') { throw 'Protocol handler remains after uninstall' }
          $sum=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$sum  $(Split-Path $setup -Leaf)" | Set-Content -Encoding ascii installer\SHA256SUMS.txt
          Write-Host "Setup smoke PASS: $sum"

      - uses: actions/upload-artifact@v4
        with:
          name: Makia-Windows-OneClick-x64-1.6.5.1-UAT
          path: |
            installer/*.exe
            installer/SHA256SUMS.txt
            package/
          if-no-files-found: error
          retention-days: 90


  # Uploads to the workflow artifact store only. Publishing a Windows UAT
  # package requires a separately approved, version-matched release process.
