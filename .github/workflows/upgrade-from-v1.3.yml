name: Upgrade From 1.3.0 Smoke
# Production parity gate: exact 1.3.0 -> candidate with retained inactive Stealth.

on:
  pull_request:
    paths:
      - "scripts/update.sh"
      - "scripts/uat-smoke.sh"
      - "scripts/doctor.sh"
      - "upgrade.sh"
      - "app/**"
      - "systemd/**"
      - "VERSION"
      - ".github/workflows/upgrade-from-v1.3.yml"
  workflow_dispatch:

concurrency:
  group: upgrade-v130-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-v130:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build Ubuntu 24.04 systemd test image
        shell: bash
        run: |
          cat > /tmp/MakiaUpgradeDockerfile <<'EOF'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive container=docker
          RUN apt-get update \
           && apt-get install -y systemd systemd-sysv dbus curl ca-certificates \
           && apt-get clean \
           && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          EOF
          docker build -t makia-upgrade-v130 -f /tmp/MakiaUpgradeDockerfile /tmp

      - name: Start VPS-like container
        shell: bash
        run: |
          extra=()
          if [[ -e /dev/net/tun ]]; then extra+=(--device /dev/net/tun); fi
          docker run -d --name makia-upgrade \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /lib/modules:/lib/modules:ro \
            --tmpfs /run --tmpfs /run/lock \
            "${extra[@]}" makia-upgrade-v130
          for i in {1..30}; do
            docker exec makia-upgrade systemctl list-units >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs makia-upgrade
          exit 1

      - name: Checkout exact production baseline 1.3.0
        uses: actions/checkout@v5
        with:
          ref: 3a2b5eb8f33063eb41f04c073e159ade18a28d8c
          path: baseline-v130

      - name: Install exact production baseline 1.3.0
        shell: bash
        run: |
          docker cp baseline-v130 makia-upgrade:/tmp/makia-v130
          set +e
          docker exec \
            -e MAKIA_INITIAL_ADMIN_PASSWORD="UpgradeBaseline!130" \
            makia-upgrade bash -lc 'bash /tmp/makia-v130/scripts/install.sh'
          install_rc=$?
          set -e
          echo "Baseline installer exit: $install_rc"
          docker exec makia-upgrade bash -lc '
            test "$(cat /opt/makia-vps-manager/VERSION)" = "1.3.0"
            systemctl enable --now nginx
            cd /opt/makia-vps-manager
            MAKIA_DATA_DIR=/opt/makia-vps-manager/data .venv/bin/python -c "from app.security import ensure_secret; ensure_secret()"
            systemctl restart makia-vps-manager
            curl -fsS http://127.0.0.1:8787/healthz | grep -q "\"version\":\"1.3.0\""
            systemctl is-active --quiet xray
            systemctl is-active --quiet wg-quick@wg0
            systemctl is-active --quiet openvpn-server@server
          '

      - name: Reproduce production inactive Stealth state
        shell: bash
        run: |
          docker exec makia-upgrade bash -lc '
            install -d -m 0755 /etc/stunnel
            cat >/etc/stunnel/makia-openvpn.conf <<EOF
          pid = /run/stunnel4/makia-openvpn.pid
          [makia-openvpn]
          accept = 9443
          connect = 127.0.0.1:8443
          EOF
            touch /etc/default/stunnel4
            sed -i "/^[[:space:]]*ENABLED=/d" /etc/default/stunnel4
            echo "ENABLED=0" >> /etc/default/stunnel4
            systemctl stop stunnel4 2>/dev/null || true
            ! systemctl is-active --quiet stunnel4
          '

      - name: Snapshot existing production identity and network state
        shell: bash
        run: |
          docker exec makia-upgrade bash -lc '
            cd /opt/makia-vps-manager
            MAKIA_DATA_DIR=/opt/makia-vps-manager/data .venv/bin/python - <<'"'"'PY'"'"' >/root/pre-admin.hash
from app.db import connect
with connect() as con:
    row=con.execute("SELECT password_hash FROM admins WHERE username='"'"'admin'"'"'").fetchone()
assert row and row[0]
print(row[0])
PY
            awk -F= "/^[[:space:]]*PrivateKey[[:space:]]*=/{gsub(/[[:space:]]/,\"\",\$2); print \$2}" /etc/wireguard/wg0.conf > /root/pre-wg-private
            sha256sum /etc/openvpn/server/pki/ca.crt | awk "{print \$1}" > /root/pre-ovpn-ca
            python3 - <<'"'"'PY'"'"' >/root/pre-xray-ids
import json
from pathlib import Path
p=Path("/usr/local/etc/xray/config.json")
if not p.exists(): p=Path("/etc/xray/config.json")
obj=json.loads(p.read_text())
ids=[]
for inbound in obj.get("inbounds",[]):
    for c in (inbound.get("settings") or {}).get("clients",[]) or []:
        if c.get("id"): ids.append(str(c["id"]))
print("\n".join(sorted(set(ids))))
PY
          '

      - name: Upgrade 1.3.0 to exact candidate SHA
        shell: bash
        run: |
          docker exec \
            -e MAKIA_REF="${GITHUB_SHA}" \
            -e MAKIA_FORCE_MAIN="0" \
            makia-upgrade bash -lc 'makia-upgrade'

      - name: Verify upgrade persisted and did not rotate existing state
        shell: bash
        run: |
          docker exec makia-upgrade bash -lc '
            test "$(cat /opt/makia-vps-manager/VERSION)" = "1.4.1"
            curl -fsS http://127.0.0.1:8787/healthz | grep -q "\"version\":\"1.4.1\""
            systemctl is-active --quiet makia-vps-manager
            systemctl is-active --quiet nginx
            systemctl is-active --quiet xray
            systemctl is-active --quiet wg-quick@wg0
            systemctl is-active --quiet openvpn-server@server

            cd /opt/makia-vps-manager
            MAKIA_DATA_DIR=/opt/makia-vps-manager/data .venv/bin/python - <<'"'"'PY'"'"' >/root/post-admin.hash
from app.db import connect
with connect() as con:
    row=con.execute("SELECT password_hash FROM admins WHERE username='"'"'admin'"'"'").fetchone()
assert row and row[0]
print(row[0])
PY
            cmp -s /root/pre-admin.hash /root/post-admin.hash

            awk -F= "/^[[:space:]]*PrivateKey[[:space:]]*=/{gsub(/[[:space:]]/,\"\",\$2); print \$2}" /etc/wireguard/wg0.conf > /root/post-wg-private
            cmp -s /root/pre-wg-private /root/post-wg-private

            sha256sum /etc/openvpn/server/pki/ca.crt | awk "{print \$1}" > /root/post-ovpn-ca
            cmp -s /root/pre-ovpn-ca /root/post-ovpn-ca

            python3 - <<'"'"'PY'"'"' >/root/post-xray-ids
import json
from pathlib import Path
p=Path("/usr/local/etc/xray/config.json")
if not p.exists(): p=Path("/etc/xray/config.json")
obj=json.loads(p.read_text())
ids=[]
for inbound in obj.get("inbounds",[]):
    for c in (inbound.get("settings") or {}).get("clients",[]) or []:
        if c.get("id"): ids.append(str(c["id"]))
print("\n".join(sorted(set(ids))))
PY
            cmp -s /root/pre-xray-ids /root/post-xray-ids

            ! systemctl is-active --quiet stunnel4
            grep -Eq "^[[:space:]]*ENABLED[[:space:]]*=[[:space:]]*0[[:space:]]*$" /etc/default/stunnel4

            makia-doctor
            makia-uat-smoke
          '

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker exec makia-upgrade cat /opt/makia-vps-manager/VERSION || true
          docker exec makia-upgrade curl -sS http://127.0.0.1:8787/healthz || true
          docker exec makia-upgrade makia-doctor || true
          docker exec makia-upgrade makia-uat-smoke || true
          docker exec makia-upgrade systemctl --failed --no-pager || true
          docker exec makia-upgrade journalctl -u makia-vps-manager -n 200 --no-pager || true
