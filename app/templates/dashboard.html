<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="application-name" content="Makia VPS Manager">
  <title>{{app_name}}</title>
  <link rel="manifest" href="/static/manifest.webmanifest?v={{version}}">
  <link rel="icon" href="/static/makia.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{version}}">
</head>
<body class="makia-sanaei-shell" data-theme="{{theme}}" data-density="{{density}}">
  <aside class="sanaei-sidebar" id="sidebar">
    <div class="sanaei-brand">
      <img src="/static/makia.svg" alt="">
      <div class="sanaei-brand-text"><strong>MAKIA</strong><span>VPS MANAGER</span></div>
      <button type="button" class="sidebar-pin-btn" data-shell-action="sidebar-pin" title="ثابت نگه داشتن منو" aria-label="ثابت نگه داشتن منو">⌖</button>
    </div>

    <button class="sanaei-command" type="button" data-shell-action="command">
      <span class="menu-symbol">⌕</span><b>جستجو...</b><kbd>Ctrl K</kbd>
    </button>

    <nav class="sanaei-nav" aria-label="منوی اصلی">
      <button data-view="dashboard" class="active"><span class="menu-symbol">⌂</span><b>داشبورد</b></button>
      <button data-view="inbounds"><span class="menu-symbol">⇲</span><b>Inboundها</b></button>
      <button data-view="access"><span class="menu-symbol">♙</span><b>کاربران</b></button>
      <div class="sanaei-nav-group">
        <button class="sanaei-group-toggle" type="button" data-shell-action="sidebar-group" data-group="protocolclients"><span class="menu-symbol">◫</span><b>دسترسی‌ها</b><em>⌄</em></button>
        <div class="sanaei-submenu" data-group-panel="protocolclients">
          <button data-view="ssh"><span>•</span><b>SSH / NPV</b></button>
          <button data-view="xray"><span>•</span><b>Xray / V2Ray</b></button>
          <button data-view="wireguard"><span>•</span><b>WireGuard</b></button>
          <button data-view="openvpn"><span>•</span><b>OpenVPN</b></button>
        </div>
      </div>

      <div class="sanaei-nav-sep"></div>
      <button data-view="nodes"><span class="menu-symbol">◎</span><b>نودها</b></button>
      <button data-view="protocols"><span class="menu-symbol">⇄</span><b>شبکه و پورت‌ها</b></button>
      <button data-view="services"><span class="menu-symbol">▣</span><b>سرویس‌ها</b></button>
      <button data-view="sessions"><span class="menu-symbol">◉</span><b>اتصال‌های زنده</b></button>

      <div class="sanaei-nav-group">
        <button class="sanaei-group-toggle" type="button" data-shell-action="sidebar-group" data-group="settings"><span class="menu-symbol">⚙</span><b>تنظیمات</b><em>⌄</em></button>
        <div class="sanaei-submenu" data-group-panel="settings">
          <button data-action="nav-settings" data-tab="general"><span>•</span><b>عمومی</b></button>
          <button data-action="nav-settings" data-tab="security"><span>•</span><b>امنیت مدیر</b></button>
          <button data-action="nav-settings" data-tab="subscription"><span>•</span><b>Subscription</b></button>
          <button data-action="nav-settings" data-tab="api"><span>•</span><b>API Tokens</b></button>
          <button data-action="nav-settings" data-tab="recovery"><span>•</span><b>Recovery</b></button>
        </div>
      </div>

      <div class="sanaei-nav-group">
        <button class="sanaei-group-toggle" type="button" data-shell-action="sidebar-group" data-group="xraytools"><span class="menu-symbol">⌘</span><b>ابزارهای Xray</b><em>⌄</em></button>
        <div class="sanaei-submenu" data-group-panel="xraytools">
          <button type="button" data-action="xray-diagnostics"><span>•</span><b>Diagnostics</b></button>
          <button type="button" data-action="nav-settings" data-tab="xray"><span>•</span><b>Xray Defaults</b></button>
          <button type="button" data-action="xray-advanced"><span>•</span><b>Advanced JSON</b></button>
        </div>
      </div>

      <div class="sanaei-nav-sep"></div>
      <button data-view="audit"><span class="menu-symbol">▤</span><b>لاگ‌ها</b></button>
      <button data-view="backups"><span class="menu-symbol">↺</span><b>بکاپ</b></button>
      <button data-view="updates"><span class="menu-symbol">⇧</span><b>بروزرسانی</b></button>
      <button data-view="guides"><span class="menu-symbol">?</span><b>راهنما</b></button>
      <button data-view="support"><span class="menu-symbol">◌</span><b>پشتیبانی</b></button>
    </nav>

    <div class="sanaei-sidebar-footer">
      <div class="sanaei-server-state"><i></i><span><b>Server</b><small>{{ panel_domain or 'IP Mode' }}</small></span></div>
      <span class="sanaei-version">v{{version}}</span>
      <form action="/logout" method="post"><button class="sidebar-logout" type="submit" title="خروج">↪ <b>خروج</b></button></form>
    </div>
  </aside>

  <main class="sanaei-content-shell">
    <header class="sanaei-mobile-header">
      <button class="mobile-menu-toggle" type="button" aria-label="باز کردن منو" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div><img src="/static/makia.svg" alt=""><strong>MAKIA</strong></div>
      <button type="button" data-shell-action="create-access">＋</button>
    </header>

    <div class="compat-page-meta" aria-hidden="true">
      <span id="pageContext">MAKIA CONTROL CENTER</span><span id="pageTitle">Dashboard</span>
    </div>
    <section id="content" class="sanaei-content" aria-live="polite"></section>
  </main>

  <div id="modalRoot"></div>
  <script>
    window.MAKIA_VERSION='{{version}}';
    window.MAKIA_LANG='{{language}}';
    window.PANEL_DOMAIN='{{panel_domain}}';
    window.MAKIA_THEME='{{theme}}';
    window.MAKIA_DENSITY='{{density}}';
    window.MAKIA_USER='{{current_username or "admin"}}';
  </script>
  <script src="/static/app.js?v={{version}}"></script>
</body>
</html>
