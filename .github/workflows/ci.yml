name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Python compile
        run: python -m compileall -q app owner_console tests scripts/restore-portable.py tools/license_issue.py scripts/configure-owner.py
      - name: Import application smoke test
        run: |
          python -c "import app.main; print(app.main.APP_NAME, app.main.VERSION)"
          python -c "import owner_console.app; print('Owner Control Center import PASS')"
      - name: Unit tests
        run: pytest -q
      - name: Bash syntax
        run: bash -n install.sh upgrade.sh scripts/*.sh tools/*.sh
      - name: JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check owner_console/static/owner.js
      - name: Dangerous pattern guard
        run: |
          ! grep -R --line-number -E 'chmod[[:space:]]+777|shell=True|os\.system\(' app owner_console scripts tools install.sh systemd nginx
      - name: Makia naming contract
        run: |
          grep -q 'Makia VPS Manager' app/config.py
          grep -q '/opt/makia-vps-manager' scripts/install.sh
          grep -q 'makia-vps-manager.service' scripts/install.sh

      - name: Packaging contract
        run: |
          grep -q 'makia-protocol-traffic.service' scripts/install.sh
          grep -q 'makia-protocol-traffic.service' scripts/update.sh
          grep -q 'makia-doctor' scripts/install.sh
          grep -q 'makia-doctor' scripts/update.sh
          grep -q 'makia-protocol-traffic' scripts/uninstall.sh
          test -f systemd/makia-protocol-traffic.service
          test -f scripts/doctor.sh
          test -f upgrade.sh
          grep -q 'makia-upgrade' scripts/install.sh
          grep -q 'makia-upgrade' scripts/update.sh
          test -f app/static/manifest.webmanifest
          test -f app/static/sw.js
          test -f docs/UAT-0.8.0-RC2.md
          test -f docs/UAT-0.11.0-RC1.md
          test -f docs/UAT-0.12.0-RC1.md
          test -f docs/UAT-0.13.0-RC1.md
          test -f docs/UAT-0.13.1-RC1.md
          test -f docs/UAT-0.14.0-RC1.md
          test -f docs/UAT-0.15.0-RC1.md
          test -f docs/UAT-0.16.0-RC1.md
          test -f docs/UAT-0.17.0-RC1.md
          test -f docs/UAT-0.17.0-RC2.md
          test -f docs/UAT-0.17.0-RC3.md
          test -f docs/OWNER-CONTROL-CENTER-FA.md
          test -f docs/REMOTE-SUPPORT-SECURITY-FA.md
          test -f owner_console/app.py
          test -f owner_console/license_service.py
          test -f owner_console/static/owner.js
          test -f owner_console/templates/index.html
          test -f tools/install-owner-console.sh
          test -f systemd/makia-owner-console.service
          test -f docs/SECURITY-LICENSING.md
          test -f app/license_public_key.pem
          test -f tools/license_issue.py
          test -f scripts/configure-owner.py
          test -f README_FA.md
          test -f docs/CLIENT-GUIDE-FA.md
          test -f app/templates/client_guide.html
          test -f scripts/xray-cert-sync.sh
          grep -q 'makia-xray-sync' scripts/install.sh
          grep -q 'makia-xray-sync' scripts/update.sh
          test -f scripts/uat-smoke.sh
          test -f scripts/restore-portable.py
          grep -q 'makia-restore-portable' scripts/install.sh
          grep -q 'makia-restore-portable' scripts/update.sh
          grep -q 'makia-uat-smoke' scripts/install.sh
          grep -q 'makia-uat-smoke' scripts/update.sh
          grep -q 'makia-owner-config' scripts/install.sh
          grep -q 'makia-owner-config' scripts/update.sh
      - name: UAT v0.11 contract
        run: |
          grep -q 'Protected ZIP' docs/UAT-0.11.0-RC1.md
          grep -q 'Browser Smoke' docs/UAT-0.11.0-RC1.md
          grep -q 'data-action="protected-export"' app/static/app.js
      - name: UAT v0.12 contract
        run: |
          grep -q 'NPV Tunnel' docs/UAT-0.12.0-RC1.md
          grep -q 'Xray subscription QR' docs/UAT-0.12.0-RC1.md
          grep -q 'data-action="access-share"' app/static/app.js
          grep -q '/api/settings/operator' app/static/app.js
          grep -q 'npvt-ssh://' app/access_ops.py

      - name: UAT v0.13 contract
        run: |
          grep -q 'Portable Migration Bundle' docs/UAT-0.13.0-RC1.md
          grep -q 'WireGuard compatibility' docs/UAT-0.13.0-RC1.md
          grep -q 'makia-restore-portable' docs/UAT-0.13.0-RC1.md
          grep -q '/api/backups/portable' app/main.py
          grep -q 'wg-compat-preset' app/static/app.js
          grep -q 'Advanced JSON' app/static/app.js
          grep -q 'portable_migration_files' app/system_ops.py
          grep -q 'Preserving active Makia Nginx/Certbot configuration' scripts/update.sh
          grep -q '_xray_firewall_rules' app/protocol_ops.py
          grep -q '_ufw_allow_if_active' app/protocol_ops.py

      - name: UAT v0.13.1 contract
        run: |
          grep -q 'Xray Runtime / Client Guide UAT' docs/UAT-0.13.1-RC1.md
          grep -q '/api/protocols/xray/diagnostics' app/main.py
          grep -q '/api/protocols/xray/repair' app/main.py
          grep -q '_xray_test_config_as_service' app/protocol_ops.py
          grep -q '_xray_secure_runtime_file' app/protocol_ops.py
          grep -q 'XRAY_VALIDATED_VERSION="v26.3.27"' app/protocol_ops.py
          grep -q '/help/connect' app/main.py
          grep -q 'connection-guide-fa.txt' app/access_ops.py
          grep -q "data-view=\"guides\"" app/templates/dashboard.html
          grep -q 'xray-diagnostics' app/static/app.js
          grep -q 'xray-repair' app/static/app.js
          grep -q 'README_FA.md' README.md
          grep -q 'makia-xray-sync' scripts/update.sh
          grep -q 'repair_xray_runtime' scripts/update.sh
          grep -q 'repair_xray_runtime' scripts/restore-portable.py

      - name: UAT v0.14 contract
        run: |
          grep -q 'Glass Aurora / OpenVPN Domain UAT' docs/UAT-0.14.0-RC1.md
          grep -q 'body\[data-theme="glass"\]' app/static/app.css
          grep -q 'glass-status-hero' app/static/app.js
          grep -q 'Glass Aurora' app/static/app.js
          grep -q "const CACHE='makia-shell-v0" app/static/sw.js
          grep -q '/api/protocols/openvpn/diagnostics' app/main.py
          grep -q '/api/protocols/openvpn/repair' app/main.py
          grep -q 'openvpn_endpoint_diagnostics' app/protocol_ops.py
          grep -q 'repair_openvpn_ipv4_runtime' app/protocol_ops.py
          grep -q 'proto {transport}' app/protocol_ops.py
          grep -q 'verify-x509-name server name' app/protocol_ops.py
          grep -q '"openvpn-server@server": "OpenVPN"' app/config.py
          grep -q '"wg-quick@wg0": "WireGuard"' app/config.py
          grep -q 'Checking OpenVPN IPv4 runtime' scripts/update.sh
          grep -q 'OpenVPN IPv4 transport' scripts/uat-smoke.sh

      - name: UAT v0.15 contract
        run: |
          grep -q 'License / Security / OpenVPN Hybrid UAT' docs/UAT-0.15.0-RC1.md
          grep -q 'Ed25519' app/license_ops.py
          grep -q 'COMMUNITY_FEATURES' app/license_ops.py
          grep -q 'FULL_FEATURES' app/license_ops.py
          grep -q '/api/license/status' app/main.py
          grep -q '/api/license/activate' app/main.py
          grep -q '/api/support/requests' app/main.py
          grep -q 'license_required' app/main.py
          grep -q 'hybrid_fallback_ipv4' app/protocol_ops.py
          grep -q 'server-poll-timeout 8' app/protocol_ops.py
          grep -q 'MAKIA_SUPPORT_TELEGRAM' scripts/configure-owner.py
          grep -q 'MAKIA_ADMIN_ALLOWED_CIDRS' scripts/configure-owner.py
          grep -q 'MAKIA_RELEASE_ARCHIVE_URL' scripts/update.sh
          grep -q 'EnvironmentFile=-/etc/makia-vps-manager/makia.env' systemd/makia-vps-manager.service
          grep -q 'server_tokens off' nginx/makia-vps-manager.conf
          grep -q 'License & Support' app/templates/dashboard.html
          grep -q 'license-tier-chip' app/static/app.js
          grep -q 'release proxy' docs/SECURITY-LICENSING.md
          ! grep -R --line-number 'BEGIN PRIVATE KEY' app owner_console tools scripts docs --exclude='*.md'


      - name: UAT v0.16 contract
        run: |
          grep -q 'Owner Control Center / Remote Support UAT' docs/UAT-0.16.0-RC1.md
          grep -q 'MKLEASE1' app/license_ops.py
          grep -q 'fetch_online_lease' app/license_ops.py
          grep -q '/api/license/sync' app/main.py
          grep -q '/api/support/grants' app/main.py
          grep -q '/support/login' app/main.py
          grep -q 'require_local_admin' app/main.py
          grep -q 'support-code-box' app/static/app.js
          grep -q '/api/public/license/lease' owner_console/app.py
          grep -q '/api/public/tickets' owner_console/app.py
          grep -q 'MAKIA_OWNER_TOTP_SECRET' owner_console/config.py
          grep -q 'User=makia-owner' systemd/makia-owner-console.service
          grep -q '127.0.0.1 --port 8790' systemd/makia-owner-console.service
          grep -q -- '--control-plane' scripts/configure-owner.py
          grep -q 'MAKIA_SUPPORT_WEBHOOK_TOKEN' scripts/configure-owner.py
          ! grep -R --line-number 'BEGIN PRIVATE KEY' app owner_console tools scripts docs --exclude='*.md'


      - name: UAT v0.17 contract
        run: |
          grep -q 'WireGuard / Endpoint Compatibility UAT' docs/UAT-0.17.0-RC1.md
          grep -q 'wireguard_endpoint_diagnostics' app/protocol_ops.py
          grep -q 'repair_wireguard_runtime' app/protocol_ops.py
          grep -q 'protocol_endpoint_matrix' app/protocol_ops.py
          grep -q '/api/protocols/wireguard/diagnostics' app/main.py
          grep -q '/api/protocols/wireguard/repair' app/main.py
          grep -q '/api/protocols/endpoint-matrix' app/main.py
          grep -q 'wireguard-diagnostics' app/static/app.js
          grep -q 'wireguard-repair' app/static/app.js
          grep -q 'endpoint-matrix' app/static/app.js
          grep -q 'Checking WireGuard forwarding/NAT runtime' scripts/update.sh
          grep -q 'WireGuard forwarding + NAT + listener' scripts/uat-smoke.sh
          grep -q 'scrollbar-color:#2f6f94 transparent' app/static/app.css
          grep -q 'MAKIA_SUPPORT_WEBHOOK_TOKEN' scripts/update.sh

      - name: UAT v0.17 rc2 contract
        run: |
          grep -q 'WireGuard Repair Hardening UAT' docs/UAT-0.17.0-RC2.md
          grep -q '_wireguard_set_interface_directive' app/protocol_ops.py
          grep -q 'external_udp_verified' app/protocol_ops.py
          grep -q 'test_wireguard_repair_inserts_directives_before_first_peer' tests/test_wireguard_runtime.py
          grep -q 'test_wireguard_diagnostics_warns_when_peers_have_no_recent_handshake' tests/test_wireguard_runtime.py

  browser-smoke:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      MAKIA_DATA_DIR: /tmp/makia-browser
      MAKIA_INITIAL_ADMIN_PASSWORD: BrowserTestPass!123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Protected export browser smoke
        run: python tests/browser_smoke.py

  xray-core-smoke:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      XRAY_BIN: /tmp/xray-runtime/xray
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download Xray 26.3.27
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          mkdir -p /tmp/xray-runtime
          unzip -q /tmp/xray.zip -d /tmp/xray-runtime
          chmod +x /tmp/xray-runtime/xray
          /tmp/xray-runtime/xray version
      - name: Validate guided Xray protocol matrix
        run: python tests/xray_core_smoke.py
