name: Native Connector Build

on:
  pull_request:
    paths:
      - "client/windows/**"
      - "client/browser-extension/**"
      - "app/client_connector.py"
      - "app/client_portal.py"
      - "app/static/client.js"
      - "app/templates/client_app.html"
      - ".github/workflows/native-connector.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-connector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Connector and extension syntax/tests
        shell: pwsh
        run: |
          python -m py_compile client/windows/makia_client_connector.py client/windows/test_connector.py app/client_connector.py app/client_portal.py
          python -m unittest client.windows.test_connector
          node --check app/static/client.js
          node --check client/browser-extension/background.js
          node --check client/browser-extension/popup.js

      - name: Build full-device and browser host executables
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
          pyinstaller --noconfirm --clean --onefile --name MakiaClientConnector --uac-admin client/windows/makia_client_connector.py
          pyinstaller --noconfirm --clean --onefile --name MakiaBrowserHost client/windows/makia_client_connector.py

      - name: Fetch pinned sing-box 1.14.2
        shell: pwsh
        run: |
          $url="https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-windows-amd64.zip"
          $zip="$env:RUNNER_TEMP\sing-box.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32") { throw "sing-box checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sing-box" -Force
          $bin=Get-ChildItem "$env:RUNNER_TEMP\sing-box" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (!$bin) { throw "sing-box.exe not found" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\MakiaClientConnector.exe package\MakiaClientConnector.exe
          Copy-Item dist\MakiaBrowserHost.exe package\MakiaBrowserHost.exe
          Copy-Item $bin.FullName package\sing-box.exe
          Copy-Item client\windows\install.ps1 package\install.ps1
          Copy-Item client\windows\uninstall.ps1 package\uninstall.ps1
          Copy-Item client\windows\Install-Makia.cmd package\Install-Makia.cmd
          Copy-Item client\windows\Uninstall-Makia.cmd package\Uninstall-Makia.cmd
          Copy-Item client\windows\INSTALL.txt package\INSTALL.txt
          Copy-Item -Recurse client\browser-extension package\browser-extension

      - name: Smoke package and real installer
        shell: pwsh
        run: |
          package\MakiaClientConnector.exe --status
          if ($LASTEXITCODE -ne 0) { throw "connector status smoke failed" }
          if (!(Test-Path package\MakiaBrowserHost.exe)) { throw "browser native host missing" }
          if (!(Test-Path package\sing-box.exe)) { throw "sing-box missing" }
          package\sing-box.exe version

          $manifest=Get-Content package\browser-extension\manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne "1.4.1") { throw "browser extension version mismatch" }
          if ($manifest.permissions -notcontains "nativeMessaging" -or $manifest.permissions -notcontains "proxy") { throw "browser extension permissions missing" }

          $oldLocal=$env:LOCALAPPDATA
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP "makia-installer-smoke"
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File package\install.ps1 -SourceDir (Resolve-Path package).Path
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 execution failed" }

            $installed=Join-Path $env:LOCALAPPDATA "Makia\Connector\bin\MakiaClientConnector.exe"
            $browser=Join-Path $env:LOCALAPPDATA "Makia\Connector\bin\MakiaBrowserHost.exe"
            if (!(Test-Path $installed)) { throw "installed connector missing" }
            if (!(Test-Path $browser)) { throw "installed browser host missing" }

            $chromeHost=(Get-Item "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.makia.browser_host").GetValue("")
            $edgeHost=(Get-Item "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.makia.browser_host").GetValue("")
            if (!(Test-Path $chromeHost) -or $chromeHost -ne $edgeHost) { throw "native messaging registration invalid" }
            $hostConfig=Get-Content $chromeHost -Raw | ConvertFrom-Json
            if ($hostConfig.allowed_origins[0] -ne "chrome-extension://jgpmmenelldgfmjfnonhjaaaccfeniji/") { throw "extension id mismatch" }

            $registered=(Get-Item "HKCU:\Software\Classes\makia\shell\open\command").GetValue("")
            if ([string]::IsNullOrWhiteSpace($registered) -or !$registered.Contains("MakiaClientConnector.exe") -or !$registered.Contains("%1")) {
              throw "makia:// registry command invalid: $registered"
            }
          }
          finally {
            Remove-Item -Recurse -Force "HKCU:\Software\Classes\makia" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.makia.browser_host" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.makia.browser_host" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $env:LOCALAPPDATA -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA=$oldLocal
          }

      - name: Generate package checksums
        shell: pwsh
        run: |
          @(
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
          ) | Set-Content -Encoding ascii package\BUILD-INFO.txt
          $lines = Get-ChildItem package -File | Sort-Object Name | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii package\SHA256SUMS.txt
          Get-Content package\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Makia-Client-Connector-Windows-x64-1.4.1
          path: package/
          if-no-files-found: error
