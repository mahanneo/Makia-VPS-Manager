<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b34">
  <meta name="application-name" content="Makia VPS Manager">
  <title>{{app_name}}</title>
  <link rel="manifest" href="/static/manifest.webmanifest?v={{version}}">
  <link rel="icon" href="/static/makia.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{version}}">
</head>
<body data-theme="{{theme}}" data-density="{{density}}">
  <div class="noise"></div>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-copy">
        <strong>MAKIA</strong>
        <span>VPS MANAGER</span>
      </div>
      <span class="release-dot" title="Release channel"></span>
    </div>

    <div class="server-pill node-card">
      <div class="node-status"><i></i></div>
      <div>
        <b>Control Node</b>
        <small>{{ panel_domain or 'IP Mode' }}</small>
      </div>
      <span class="node-live">LIVE</span>
    </div>

    <button class="sidebar-create" type="button" data-shell-action="create-access">
      <span>＋</span><b>ساخت دسترسی جدید</b>
    </button>

    <nav aria-label="Main navigation">
      <p class="nav-label">CONTROL CENTER</p>
      <button data-view="dashboard" class="active"><span>⌂</span><b>Overview</b></button>
      <button data-view="access"><span>◈</span><b>All Clients</b></button>

      <p class="nav-label">PROTOCOLS</p>
      <button data-view="ssh"><span>〉_</span><b>SSH / NPV</b></button>
      <button data-view="xray"><span>✦</span><b>Xray / V2Ray</b></button>
      <button data-view="wireguard"><span>⌁</span><b>WireGuard</b></button>
      <button data-view="openvpn"><span>◉</span><b>OpenVPN</b></button>
      <button data-view="protocols"><span>▦</span><b>Protocol Hub</b></button>

      <p class="nav-label">OPERATIONS</p>
      <button data-view="sessions"><span>◉</span><b>Live Sessions</b></button>
      <button data-view="services"><span>⚙</span><b>Services</b></button>
      <button data-view="nodes"><span>◎</span><b>Nodes</b></button>
      <button data-view="guides"><span>?</span><b>Client Guides</b></button>

      <p class="nav-label">SYSTEM</p>
      <button data-view="security"><span>◇</span><b>Security</b></button>
      <button data-view="backups"><span>↺</span><b>Backups</b></button>
      <button data-view="audit"><span>☷</span><b>Audit Logs</b></button>
      <button data-view="updates"><span>⇧</span><b>Update Center</b></button>
      <button data-view="settings"><span>⌘</span><b>Settings</b></button>
      <button data-view="support"><span>◆</span><b>Support</b></button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-version"><span>Release</span><b>v{{version}}</b></div>
      <form action="/logout" method="post"><button class="logout" type="submit">خروج امن</button></form>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <button class="mobile-menu-toggle" type="button" aria-label="باز کردن منو" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="page-heading">
        <div class="eyebrow" id="pageContext">MAKIA CONTROL CENTER</div>
        <h1 id="pageTitle">Overview</h1>
      </div>
      <div class="top-actions">
        <div class="environment-chip">
          <span>PRIMARY</span>
          <b>{{ panel_domain or 'IP MODE' }}</b>
        </div>
        <button class="command-trigger" type="button" data-shell-action="command">
          <span>⌕</span><b>Search Makia</b><kbd>Ctrl K</kbd>
        </button>
        <div class="live-chip"><i></i><span>LIVE</span></div>
        <button class="icon-btn" type="button" data-shell-action="refresh" title="Refresh current view">↻</button>
      </div>
    </header>
    <section id="content" aria-live="polite"></section>
  </main>

  <div id="modalRoot"></div>
  <script>
    window.MAKIA_VERSION='{{version}}';
    window.MAKIA_LANG='{{language}}';
    window.PANEL_DOMAIN='{{panel_domain}}';
    window.MAKIA_THEME='{{theme}}';
    window.MAKIA_DENSITY='{{density}}';
  </script>
  <script src="/static/app.js?v={{version}}"></script>
</body>
</html>
