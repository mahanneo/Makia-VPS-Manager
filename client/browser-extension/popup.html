<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Makia Browser VPN</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="mark">M</span><div><strong>Makia</strong><small>Browser VPN · v1.5</small></div></div>
      <span id="statusDot" class="dot off"></span>
    </header>

    <section id="setupView" class="card">
      <h1>اتصال به Makia</h1>
      <p>بدون نصب برنامه ویندوز؛ فقط آدرس پنل و حساب کاربری Makia را وارد کنید.</p>
      <label>آدرس پنل</label>
      <input id="controller" type="url" placeholder="https://p.example.com" autocomplete="url">
      <label>نام کاربری</label>
      <input id="username" autocomplete="username">
      <label>رمز عبور</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginBtn" class="primary">ورود امن</button>
      <div id="setupError" class="error"></div>
    </section>

    <section id="appView" class="hidden">
      <div class="hero card">
        <div>
          <span id="connectionState" class="eyebrow">قطع</span>
          <h1 id="activeLabel">Browser VPN</h1>
          <p id="accountMeta">—</p>
        </div>
        <button id="disconnectBtn" class="danger hidden">قطع</button>
      </div>

      <div class="sectionHead"><strong>اتصال امن مرورگر</strong><button id="refreshBtn" class="link">↻</button></div>
      <div id="gatewayCard" class="profile">
        <div>
          <strong>Makia Secure Gateway</strong>
          <small id="gatewayMeta">در حال بررسی…</small>
          <span class="badge">بدون نصب ویندوز</span>
        </div>
        <button id="connectBtn">اتصال</button>
      </div>
      <div id="appError" class="error"></div>

      <footer>
        <button id="logoutBtn" class="link">خروج از حساب</button>
        <span>فقط ترافیک Chrome / Edge</span>
      </footer>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
