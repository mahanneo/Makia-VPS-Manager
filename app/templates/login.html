<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111e">
  <meta name="color-scheme" content="dark light">
  <title>{{app_name}}</title>
  <link rel="icon" href="/static/makia.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{version}}">
</head>
<body class="sanaei-login pro-login" data-theme="dark">
  <div class="login-ambient" aria-hidden="true"><i></i><i></i></div>

  <div class="pro-login-toolbar" aria-label="تنظیمات ورود">
    <button id="loginLangToggle" type="button" title="Language" aria-label="تغییر زبان"><span id="loginLangText">FA</span></button>
    <button id="loginThemeToggle" type="button" title="Theme" aria-label="تغییر تم"><span id="loginThemeIcon">☾</span></button>
  </div>

  <main class="pro-login-card">
    <div class="pro-login-brand">
      <div class="pro-login-logo"><img src="/static/makia.svg" alt=""></div>
      <strong>MAKIA</strong><span>VPS MANAGER</span>
    </div>

    <div class="pro-login-heading">
      <span class="pro-login-kicker">SECURE CONTROL CENTER</span>
      <h1 id="loginTitle">خوش آمدید</h1>
      <p id="loginSubtitle">برای ورود به پنل، اطلاعات مدیر را وارد کنید.</p>
    </div>

    {% if error %}<div class="alert pro-login-alert">{{error}}</div>{% endif %}

    <form method="post" class="pro-login-form" autocomplete="on">
      <label>
        <span id="loginUserLabel">نام کاربری</span>
        <div class="pro-login-field">
          <i aria-hidden="true">♙</i>
          <input id="loginUsername" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus placeholder="admin">
        </div>
      </label>
      <label>
        <span id="loginPassLabel">رمز عبور</span>
        <div class="pro-login-field">
          <i aria-hidden="true">⌑</i>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" id="toggleLoginPassword" class="pro-password-toggle" aria-label="نمایش رمز" title="نمایش رمز">◉</button>
        </div>
      </label>
      <button id="loginSubmit" class="pro-login-submit" type="submit"><span>ورود</span><i aria-hidden="true">←</i></button>
    </form>

    <div class="pro-login-security">
      <span><i></i><b id="loginSecureText">ورود امن مدیر</b></span>
      <small>v{{version}}</small>
    </div>
  </main>

  <script>
  (() => {
    const root=document.documentElement,body=document.body;
    const langBtn=document.getElementById('loginLangToggle');
    const themeBtn=document.getElementById('loginThemeToggle');
    const password=document.getElementById('loginPassword');
    const passwordBtn=document.getElementById('toggleLoginPassword');
    const copy={
      fa:{lang:'FA',title:'خوش آمدید',subtitle:'برای ورود به پنل، اطلاعات مدیر را وارد کنید.',user:'نام کاربری',pass:'رمز عبور',submit:'ورود',secure:'ورود امن مدیر',show:'نمایش رمز',hide:'پنهان کردن رمز'},
      en:{lang:'EN',title:'Welcome back',subtitle:'Enter your administrator credentials to continue.',user:'Username',pass:'Password',submit:'Sign in',secure:'Secure admin session',show:'Show password',hide:'Hide password'}
    };
    let lang=localStorage.getItem('makia-login-lang')||'fa';
    let theme=localStorage.getItem('makia-login-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');

    function applyLang(){
      if(!copy[lang])lang='fa';
      const t=copy[lang];
      root.lang=lang;root.dir=lang==='fa'?'rtl':'ltr';
      document.getElementById('loginLangText').textContent=t.lang;
      document.getElementById('loginTitle').textContent=t.title;
      document.getElementById('loginSubtitle').textContent=t.subtitle;
      document.getElementById('loginUserLabel').textContent=t.user;
      document.getElementById('loginPassLabel').textContent=t.pass;
      document.querySelector('#loginSubmit span').textContent=t.submit;
      document.getElementById('loginSecureText').textContent=t.secure;
      passwordBtn.title=password.type==='password'?t.show:t.hide;
      passwordBtn.setAttribute('aria-label',passwordBtn.title);
    }
    function applyTheme(){
      body.dataset.theme=theme;
      document.getElementById('loginThemeIcon').textContent=theme==='dark'?'☾':'☀';
      document.querySelector('meta[name="theme-color"]').setAttribute('content',theme==='dark'?'#08111e':'#eef4fb');
    }
    langBtn.addEventListener('click',()=>{lang=lang==='fa'?'en':'fa';localStorage.setItem('makia-login-lang',lang);applyLang()});
    themeBtn.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('makia-login-theme',theme);applyTheme()});
    passwordBtn.addEventListener('click',()=>{
      password.type=password.type==='password'?'text':'password';
      passwordBtn.textContent=password.type==='password'?'◉':'◌';
      applyLang();
      password.focus({preventScroll:true});
    });
    applyLang();applyTheme();
  })();
  </script>
</body>
</html>
