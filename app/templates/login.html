<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b101a"><title>{{app_name}}</title>
  <link rel="icon" href="/static/makia.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{version}}">
</head>
<body class="sanaei-login" data-theme="glass">
  <div class="sanaei-login-toolbar">
    <button type="button" title="زبان">FA</button>
    <button type="button" title="ظاهر">◐</button>
  </div>
  <main class="sanaei-login-card">
    <div class="sanaei-login-brand"><img src="/static/makia.svg" alt=""><strong>MAKIA</strong><span>VPS MANAGER</span></div>
    <h1>خوش آمدید</h1><p>برای ورود به پنل اطلاعات مدیر را وارد کنید.</p>
    {% if error %}<div class="alert">{{error}}</div>{% endif %}
    <form method="post" class="sanaei-login-form">
      <label><span>نام کاربری</span><div class="sanaei-login-input"><b>♙</b><input name="username" autocomplete="username" required autofocus placeholder="admin"></div></label>
      <label><span>رمز عبور</span><div class="sanaei-login-input"><b>⌑</b><input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"><button type="button" id="toggleLoginPassword" aria-label="نمایش رمز">◉</button></div></label>
      <button class="sanaei-login-submit" type="submit">ورود</button>
    </form>
    <div class="sanaei-login-foot"><span>Secure Admin Session</span><span>v{{version}}</span></div>
  </main>
  <script>document.getElementById("toggleLoginPassword")?.addEventListener("click",()=>{const p=document.getElementById("loginPassword");if(p)p.type=p.type==="password"?"text":"password"});</script>
</body></html>
