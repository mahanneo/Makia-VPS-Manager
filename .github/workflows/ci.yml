name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Python compile
        run: python -m compileall -q app tests scripts/restore-portable.py scripts/configure-owner.py
      - name: Import application smoke test
        run: |
          python -c "import app.main; print(app.main.APP_NAME, app.main.VERSION)"
      - name: Unit tests
        run: pytest -q
      - name: Bash syntax
        run: bash -n install.sh upgrade.sh scripts/*.sh tools/*.sh tests/upgrade_v130_smoke.sh
      - name: WStunnel installer smoke
        run: |
          WSTUNNEL_DEST=/tmp/wstunnel-test bash scripts/install-wstunnel.sh
          /tmp/wstunnel-test --version | grep -q '11.0.0'
          /tmp/wstunnel-test server --help | grep -q -- '--restrict-to'
          /tmp/wstunnel-test server --help | grep -q -- '--restrict-http-upgrade-path-prefix'
          /tmp/wstunnel-test server --help | grep -q -- '--tls-certificate'
          /tmp/wstunnel-test server --help | grep -q -- '--tls-private-key'
          /tmp/wstunnel-test client --help | grep -q -- '--http-upgrade-path-prefix'
      - name: JavaScript syntax
        run: |
          node --check app/static/app.js

      - name: v1.2 network services and Iran inbound preset gate
        run: |
          pytest -q tests/test_rc8_operations.py tests/test_rc9_hardening.py tests/test_rc11_outline_runtime.py tests/test_v1_release_gate.py tests/test_xray_iran_presets.py
          grep -Fxq '1.6.0' VERSION
          grep -q 'VERSION = "1.6.0"' app/config.py
          grep -q 'makia-shell-v160' app/static/sw.js
          test -f docs/UAT-1.6.0.md
          test -f app/static/makia-brand.png
          test -f docs/assets/makia-brand.png
          test -f systemd/makia-scheduled-backup.service
          test -f systemd/makia-scheduled-backup.timer
          test -f systemd/makia-ops-monitor.service
          test -f systemd/makia-ops-monitor.timer
          grep -q 'StrictHostKeyChecking=yes' app/system_ops.py
          grep -q 'OUTLINE_GIT_BLOB_SHA' scripts/install-outline.sh
          grep -q '/api/protocols/outline/clients/{client_id}/reissue' app/main.py
          grep -q '/api/protocols/outline/clients/{client_id}/quota' app/main.py
          grep -q '/api/integrations/cloudflare/cutover' app/main.py
          grep -q '/integrations/telegram/webhook' app/main.py
          grep -q 'data-view="outline"' app/templates/dashboard.html
          grep -q 'data-view="operations"' app/templates/dashboard.html
          grep -q 'data-view="diagnostics"' app/templates/dashboard.html
          pytest -q tests/test_v12_network_services.py
          bash tests/mtg_release_smoke.sh
          grep -q 'data-view="telegramproxy"' app/templates/dashboard.html
          grep -q 'data-view="dnscenter"' app/templates/dashboard.html
          grep -q 'makia-install-mtproxy' scripts/install.sh scripts/update.sh
          grep -q 'makia-install-dns' scripts/install.sh scripts/update.sh
      - name: Client Platform 1.6.0 stable contract
        run: |
          test -f docs/UAT-1.6.0.md
          test -f docs/CLIENT-PLATFORM-V0.1.md
          test -f app/client_store.py
          test -f app/client_portal.py
          test -f app/client_admin.py
          test -f app/client_policy.py
          test -f app/templates/client_login.html
          test -f app/templates/client_app.html
          test -f app/static/client.js
          test -f app/static/client.css
          test -f app/static/client-sw.js
          grep -q 'data-view="clientplatform"' app/templates/dashboard.html
          grep -q 'MAKIA_CLIENT_PORTAL_ENABLED=auto' .env.example
          grep -q 'get_setting("client_portal_enabled","0")' app/client_portal.py
          grep -q 'makia_client_session' app/client_portal.py
          grep -q 'client_openvpn_policy_enable' app/client_admin.py
          grep -q 'client_policy_openvpn_suspend' app/client_policy.py
          grep -q 'makia-client-v160-mobile-login' app/static/client-sw.js
          test -f app/static/client-login.js
          pytest -q tests/test_client_platform.py

      - name: Backup restore and migration compatibility tests
        run: |
          pytest -q tests/test_migration_wireguard.py
          python -m py_compile scripts/restore-portable.py scripts/run-migration-restore.py
      - name: Migration security hardening
        run: |
          grep -q 'NoNewPrivileges=true' systemd/makia-vps-manager.service
          grep -q 'NoNewPrivileges=true' systemd/makia-migration-restore@.service
          grep -q 'UMask=0077' systemd/makia-migration-restore@.service
          grep -q -- '--password-file' scripts/restore-portable.py
          grep -q 'password.unlink' scripts/run-migration-restore.py
          grep -q 'automatic rollback' scripts/restore-portable.py
          grep -q 'makia-migration-restore@.service' scripts/install.sh
          grep -q 'makia-migration-restore@.service' scripts/update.sh
          ! grep -R --line-number -E 'chmod[[:space:]]+777|ProtectSystem=false.*makia-vps-manager' systemd scripts/run-migration-restore.py
      - name: Dangerous pattern guard
        run: |
          ! grep -R --line-number -E 'chmod[[:space:]]+777|shell=True|os\.system\(' app scripts tools install.sh systemd nginx
      - name: Makia naming contract
        run: |
          grep -q 'Makia VPS Manager' app/config.py
          grep -q '/opt/makia-vps-manager' scripts/install.sh
          grep -q 'makia-vps-manager.service' scripts/install.sh

      - name: Packaging contract
        run: |
          grep -q 'makia-protocol-traffic.service' scripts/install.sh
          grep -q 'makia-protocol-traffic.service' scripts/update.sh
          grep -q 'makia-doctor' scripts/install.sh
          grep -q 'makia-doctor' scripts/update.sh
          grep -q 'makia-protocol-traffic' scripts/uninstall.sh
          test -f systemd/makia-protocol-traffic.service
          test -f scripts/doctor.sh
          test -f upgrade.sh
          grep -q 'makia-upgrade' scripts/install.sh
          grep -q 'makia-upgrade' scripts/update.sh
          test -f app/static/manifest.webmanifest
          test -f app/static/sw.js
          test -f docs/UAT-0.8.0-RC2.md
          test -f docs/UAT-0.11.0-RC1.md
          test -f docs/UAT-0.12.0-RC1.md
          test -f docs/UAT-0.13.0-RC1.md
          test -f docs/UAT-0.13.1-RC1.md
          test -f docs/UAT-0.14.0-RC1.md
          test -f docs/UAT-0.15.0-RC1.md
          test -f docs/UAT-0.16.0-RC1.md
          test -f docs/UAT-0.17.0-RC1.md
          test -f docs/UAT-0.17.0-RC2.md
          test -f docs/UAT-0.17.0-RC3.md
          test -f docs/UAT-0.18.0.md
          test -f docs/UAT-0.18.1.md
          test -f docs/UAT-0.19.0.md
          test -f docs/UAT-0.20.0.md
          test -f docs/UAT-0.21.0-RC1.md
          test -f docs/UAT-0.22.0-RC1.md
          test -f docs/UAT-0.23.0-RC1.md
          test -f docs/UAT-0.24.0-RC1.md
          test -f docs/UAT-0.25.0-RC1.md
          test -f docs/UAT-0.26.0-RC1.md
          test -f docs/UAT-0.26.0-RC2.md
          test -f docs/UAT-0.26.0-RC3.md
          test -f docs/UAT-0.26.0-RC4.md
          test -f docs/UAT-0.26.0-RC5.md
          test -f docs/UAT-0.26.0-RC6.md
          grep -q 'CREDENTIAL_FILE=/root/makia-install-credentials.txt' scripts/install.sh
          grep -q 'MAKIA VPS MANAGER - INSTALL READY' scripts/install.sh
          test -f docs/UAT-PROTOCOL-MODES.md
          test -f docs/IRAN-CONNECTIVITY-FIELD-TEST.md
          test -f scripts/iran-field-preflight.sh
          test -f docs/REMOTE-SUPPORT-SECURITY-FA.md
          test -f scripts/configure-owner.py
          test -f README_FA.md
          test -f docs/CLIENT-GUIDE-FA.md
          test -f app/templates/client_guide.html
          test -f scripts/xray-cert-sync.sh
          grep -q 'makia-xray-sync' scripts/install.sh
          grep -q 'makia-xray-sync' scripts/update.sh
          test -f scripts/uat-smoke.sh
          test -f scripts/restore-portable.py
          grep -q 'makia-restore-portable' scripts/install.sh
          grep -q 'makia-restore-portable' scripts/update.sh
          grep -q 'makia-uat-smoke' scripts/install.sh
          grep -q 'makia-uat-smoke' scripts/update.sh
          grep -q 'makia-owner-config' scripts/install.sh
          grep -q 'makia-owner-config' scripts/update.sh
          test -f scripts/install-wstunnel.sh
          test -f scripts/makia-vpn-tls-sync.sh
          test -f scripts/ikev2-network.sh
          test -f systemd/makia-wstunnel.service
          test -f systemd/makia-ikev2-network.service
          grep -q 'strongswan strongswan-pki libcharon-extra-plugins' scripts/install.sh
          grep -q 'strongswan strongswan-pki libcharon-extra-plugins' scripts/update.sh
          grep -q 'makia-install-wstunnel' scripts/install.sh
          grep -q 'makia-install-wstunnel' scripts/update.sh
          grep -q 'makia-vpn-tls-sync' scripts/install.sh
          grep -q 'makia-vpn-tls-sync' scripts/update.sh
      - name: UAT v0.11 contract
        run: |
          grep -q 'Protected ZIP' docs/UAT-0.11.0-RC1.md
          grep -q 'Browser Smoke' docs/UAT-0.11.0-RC1.md
          grep -q 'data-action="protected-export"' app/static/app.js
      - name: UAT v0.12 contract
        run: |
          grep -q 'NPV Tunnel' docs/UAT-0.12.0-RC1.md
          grep -q 'Xray subscription QR' docs/UAT-0.12.0-RC1.md
          grep -q 'data-action="access-share"' app/static/app.js
          grep -q '/api/settings/operator' app/static/app.js
          grep -q 'npvt-ssh://' app/access_ops.py

      - name: UAT v0.13 contract
        run: |
          grep -q 'Portable Migration Bundle' docs/UAT-0.13.0-RC1.md
          grep -q 'WireGuard compatibility' docs/UAT-0.13.0-RC1.md
          grep -q 'makia-restore-portable' docs/UAT-0.13.0-RC1.md
          grep -q '/api/backups/portable' app/main.py
          grep -q 'wg-compat-preset' app/static/app.js
          grep -q 'Advanced JSON' app/static/app.js
          grep -q 'portable_migration_files' app/system_ops.py
          grep -q 'Preserving active Makia Nginx/Certbot configuration' scripts/update.sh
          grep -q '_xray_firewall_rules' app/protocol_ops.py
          grep -q '_ufw_allow_if_active' app/protocol_ops.py

      - name: UAT v0.13.1 contract
        run: |
          grep -q 'Xray Runtime / Client Guide UAT' docs/UAT-0.13.1-RC1.md
          grep -q '/api/protocols/xray/diagnostics' app/main.py
          grep -q '/api/protocols/xray/repair' app/main.py
          grep -q '_xray_test_config_as_service' app/protocol_ops.py
          grep -q '_xray_secure_runtime_file' app/protocol_ops.py
          grep -q 'XRAY_VALIDATED_VERSION="v26.3.27"' app/protocol_ops.py
          grep -q '/help/connect' app/main.py
          grep -q 'connection-guide-fa.txt' app/access_ops.py
          grep -Fq "['Client Guides','guides']" app/static/app.js
          grep -q 'xray-diagnostics' app/static/app.js
          grep -q 'xray-repair' app/static/app.js
          grep -q 'README_FA.md' README.md
          grep -q 'makia-xray-sync' scripts/update.sh
          grep -q 'repair_xray_runtime' scripts/update.sh
          grep -q 'repair_xray_runtime' scripts/restore-portable.py

      - name: UAT v0.14 contract
        run: |
          grep -q 'Glass Aurora / OpenVPN Domain UAT' docs/UAT-0.14.0-RC1.md
          grep -q 'body\[data-theme="glass"\]' app/static/app.css
          grep -q 'glass-status-hero' app/static/app.js
          grep -q 'Glass Aurora' app/static/app.js
          grep -q "const CACHE='makia-shell-v160'" app/static/sw.js
          grep -q '/api/protocols/openvpn/diagnostics' app/main.py
          grep -q '/api/protocols/openvpn/repair' app/main.py
          grep -q 'openvpn_endpoint_diagnostics' app/protocol_ops.py
          grep -q 'repair_openvpn_ipv4_runtime' app/protocol_ops.py
          grep -q 'proto {transport}' app/protocol_ops.py
          grep -q 'verify-x509-name server name' app/protocol_ops.py
          grep -q '"openvpn-server@server": "OpenVPN"' app/config.py
          grep -q '"wg-quick@wg0": "WireGuard"' app/config.py
          grep -q 'Checking OpenVPN IPv4 runtime' scripts/update.sh
          grep -q 'OpenVPN IPv4 transport' scripts/uat-smoke.sh

      - name: Open access contract
        run: |
          grep -q 'VERSION = "1.6.0"' app/config.py
          grep -Fxq '1.6.0' VERSION
          grep -q 'require_capability' app/main.py
          grep -q 'data-view="support"' app/templates/dashboard.html
          grep -q '/api/support/grants' app/main.py
          grep -q '/support/login' app/main.py
          grep -q 'require_local_admin' app/main.py
          grep -q 'hybrid_fallback_ipv4' app/protocol_ops.py
          grep -q 'server-poll-timeout 8' app/protocol_ops.py
          ! grep -q '/api/license' app/main.py
          ! grep -q 'license_required' app/main.py
          ! grep -q 'hasLicenseFeature' app/static/app.js
          ! grep -R --line-number 'BEGIN PRIVATE KEY' app tools scripts --exclude='*.md'

      - name: Full stack ready contract
        run: |
          grep -q 'Full Stack Ready UAT' docs/UAT-0.22.0-RC1.md
          grep -q 'ensure_full_protocol_stack' app/protocol_ops.py
          grep -q 'ensure_full_protocol_stack' scripts/install.sh
          grep -q 'ensure_full_protocol_stack' scripts/update.sh
          grep -q 'wireguard-tools openvpn easy-rsa iptables stunnel4' scripts/install.sh
          grep -q 'Xray binary missing' scripts/uat-smoke.sh
          grep -q 'OpenVPN server config missing' scripts/uat-smoke.sh
          grep -q 'WireGuard wg0 config missing' scripts/uat-smoke.sh
          grep -q 'Stunnel tooling missing' scripts/uat-smoke.sh
          grep -q 'makia-shell-v160' app/static/sw.js
          grep -q 'certbot python3-certbot-nginx' scripts/install.sh
          grep -q 'apt-get install -y fail2ban certbot python3-certbot-nginx' scripts/update.sh
          ! grep -q 'apt-get.*certbot' app/panel_ops.py
          grep -q '_certbot_nginx_plugin_ready' app/panel_ops.py

      - name: Professional UX v0.25 contract
        run: |
          grep -q 'makia-pro-shell' app/templates/dashboard.html
          grep -q 'pro-sidebar' app/templates/dashboard.html
          grep -q 'data-view="access"' app/templates/dashboard.html
          grep -q 'data-view="connectivity"' app/templates/dashboard.html
          grep -q 'data-group="protocols"' app/templates/dashboard.html
          grep -q 'data-group="infra"' app/templates/dashboard.html
          grep -q 'data-group="system"' app/templates/dashboard.html
          grep -q 'pro-user-row' app/static/app.js
          grep -q 'access-detail-drawer' app/static/app.js
          grep -q 'provision-drawer' app/static/app.js
          grep -q 'connectivityLab' app/static/app.js
          grep -q 'نیاز به تست از داخل ایران' app/static/app.js
          grep -q 'v0.25 Professional Operations UI' app/static/app.css
          grep -q 'Professional UX / Iran Connectivity UAT' docs/UAT-0.25.0-RC1.md
          grep -q 'Iran Connectivity Field Test' docs/IRAN-CONNECTIVITY-FIELD-TEST.md
          grep -q 'transport preflight only' scripts/iran-field-preflight.sh

      - name: Finalization v0.26 contract
        run: |
          grep -q '0.24.0-rc1 → 0.26.0-rc1' docs/UAT-0.26.0-RC1.md
          grep -q 'loginLangToggle' app/templates/login.html
          grep -q 'loginThemeToggle' app/templates/login.html
          grep -q 'pro-login-field:focus-within' app/static/app.css
          grep -q '_process_no_new_privileges' app/protocol_ops.py
          grep -q '_xray_static_service_validation' app/protocol_ops.py
          grep -q 'xray_guided_compatibility' app/protocol_ops.py
          grep -q 'XRAY_PROFILE_MATRIX' app/static/app.js
          grep -q '/api/protocols/openvpn/configure' app/main.py
          grep -q 'reconfigure_openvpn_server' app/protocol_ops.py
          grep -q 'openvpn-configure-save' app/static/app.js
          grep -q 'support-v26' app/static/app.js
          grep -q 'security-posture-grid' app/static/app.js
          grep -q 'visual-steps' app/templates/client_guide.html
          grep -q 'v0.26 Protocol graphics' app/static/app.css
          grep -q 'makia-shell-v160' app/static/sw.js

      - name: Pure Browser Gateway 1.6.0 contract
        run: |
          test -f app/browser_gateway.py
          test -f systemd/makia-browser-gateway.service
          test -f tests/browser_gateway_smoke.sh
          test -f docs/BROWSER-GATEWAY-1.6.0.md
          test -f docs/CHROME-WEB-STORE-1.6.0.md
          grep -q 'makia-browser-gateway.service' scripts/install.sh
          grep -q 'makia-browser-gateway.service' scripts/update.sh
          grep -q 'makia-browser-gateway' scripts/uninstall.sh
          grep -q 'makia-browser-gateway' scripts/doctor.sh
          grep -q 'makia-browser-gateway' scripts/uat-smoke.sh
          grep -q 'client_browser_tokens' app/client_store.py
          grep -q 'client_browser_usage' app/client_store.py
          grep -q '/client/extension/browser-gateway/credential' app/client_portal.py
          grep -q 'webRequestAuthProvider' client/browser-extension/manifest.json
          ! grep -q 'nativeMessaging' client/browser-extension/manifest.json
          ! grep -q 'sendNativeMessage' client/browser-extension/background.js
          grep -q 'singleProxy:{scheme:"https"' client/browser-extension/background.js
          grep -q 'Browser Extension Build' .github/workflows/browser-extension.yml
          python -m pytest -q tests/test_browser_gateway.py tests/test_browser_extension_contract.py

      - name: OpenVPN WStunnel 443 contract
        run: |
          test -f systemd/makia-openvpn-wstunnel.service
          test -f docs/WSTUNNEL-OPENVPN-443.md
          grep -q 'def bootstrap_openvpn_wstunnel' app/protocol_ops.py
          grep -q 'def render_openvpn_wstunnel_client' app/protocol_ops.py
          grep -q '/api/protocols/openvpn/wstunnel/bootstrap' app/main.py
          grep -q '/api/protocols/openvpn/wstunnel/clients' app/main.py
          grep -q 'wstunnel-openvpn' app/static/app.js
          grep -q 'makia-openvpn-wstunnel.service' scripts/install.sh
          grep -q 'makia-openvpn-wstunnel.service' scripts/update.sh
          grep -q 'makia-openvpn-wstunnel' scripts/doctor.sh
          grep -q 'openvpn-server@makia-ws' scripts/uat-smoke.sh
          pytest -q tests/test_openvpn_wstunnel.py

      - name: Connection modes contract
        run: |
          grep -q '0.26.0-rc2' docs/UAT-0.26.0-RC2.md
          grep -q 'six-mode' CHANGELOG.md
          grep -q 'def protocol_modes' app/protocol_ops.py
          grep -q 'def bootstrap_ikev2' app/protocol_ops.py
          grep -q 'def bootstrap_stealth' app/protocol_ops.py
          grep -q 'def bootstrap_wstunnel' app/protocol_ops.py
          grep -q '/api/protocols/modes' app/main.py
          grep -q '/api/protocols/ikev2/bootstrap' app/main.py
          grep -q '/api/protocols/stealth/bootstrap' app/main.py
          grep -q '/api/protocols/wstunnel/bootstrap' app/main.py
          grep -q 'Connection Modes' app/static/app.js
          grep -q 'ikev2-setup' app/static/app.js
          grep -q 'stealth-setup' app/static/app.js
          grep -q 'wstunnel-setup' app/static/app.js
          grep -q 'WSTUNNEL_VERSION:-11.0.0' scripts/install-wstunnel.sh
          grep -q 'checksum mismatch' scripts/install-wstunnel.sh
          grep -q 'IKEv2/strongSwan tooling installed' scripts/uat-smoke.sh
          grep -q 'WStunnel tooling installed' scripts/uat-smoke.sh

      - name: UAT v0.17 contract
        run: |
          grep -q 'WireGuard / Endpoint Compatibility UAT' docs/UAT-0.17.0-RC1.md
          grep -q 'wireguard_endpoint_diagnostics' app/protocol_ops.py
          grep -q 'repair_wireguard_runtime' app/protocol_ops.py
          grep -q 'protocol_endpoint_matrix' app/protocol_ops.py
          grep -q '/api/protocols/wireguard/diagnostics' app/main.py
          grep -q '/api/protocols/wireguard/repair' app/main.py
          grep -q '/api/protocols/endpoint-matrix' app/main.py
          grep -q 'wireguard-diagnostics' app/static/app.js
          grep -q 'wireguard-repair' app/static/app.js
          grep -q 'endpoint-matrix' app/static/app.js
          grep -q 'Checking WireGuard forwarding/NAT runtime' scripts/update.sh
          grep -q 'WireGuard forwarding + NAT + listener' scripts/uat-smoke.sh
          grep -q 'scrollbar-color:#2f6f94 transparent' app/static/app.css
          grep -q 'MAKIA_SUPPORT_WEBHOOK_TOKEN' scripts/update.sh

      - name: UAT v0.17 rc2 contract
        run: |
          grep -q 'WireGuard Repair Hardening UAT' docs/UAT-0.17.0-RC2.md
          grep -q '_wireguard_set_interface_directive' app/protocol_ops.py
          grep -q 'external_udp_verified' app/protocol_ops.py
          grep -q 'test_wireguard_repair_inserts_directives_before_first_peer' tests/test_wireguard_runtime.py
          grep -q 'test_wireguard_diagnostics_warns_when_peers_have_no_recent_handshake' tests/test_wireguard_runtime.py

  browser-smoke:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      MAKIA_DATA_DIR: /tmp/makia-browser
      MAKIA_BACKUP_DIR: /tmp/makia-browser-backups
      MAKIA_INITIAL_ADMIN_PASSWORD: BrowserTestPass!123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Protected export browser smoke
        run: python tests/browser_smoke.py
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makia-v026-ui-screenshots
          path: /tmp/makia-*.png
          if-no-files-found: ignore
          retention-days: 7

  xray-core-smoke:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      XRAY_BIN: /tmp/xray-runtime/xray
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download Xray 26.3.27
        run: |
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          mkdir -p /tmp/xray-runtime
          unzip -q /tmp/xray.zip -d /tmp/xray-runtime
          chmod +x /tmp/xray-runtime/xray
          /tmp/xray-runtime/xray version
      - name: Validate guided Xray protocol matrix
        run: python tests/xray_core_smoke.py
