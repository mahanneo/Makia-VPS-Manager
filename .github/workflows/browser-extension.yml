name: Browser Extension Build

permissions:
  contents: write

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "client/browser-extension/**"
      - "app/browser_gateway.py"
      - "app/client_portal.py"
      - "app/client_store.py"
      - "systemd/makia-browser-gateway.service"
      - ".github/workflows/browser-extension.yml"
      - "VERSION"
  push:
    branches: ["main"]
    paths:
      - "client/browser-extension/**"
      - "app/browser_gateway.py"
      - "app/client_portal.py"
      - "app/client_store.py"
      - "systemd/makia-browser-gateway.service"
      - ".github/workflows/browser-extension.yml"
      - "VERSION"
  workflow_dispatch:

concurrency:
  group: browser-extension-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate extension and gateway
        shell: bash
        run: |
          python3 -m py_compile app/browser_gateway.py app/client_store.py app/client_portal.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("client/browser-extension/manifest.json").read_text())
          assert m["manifest_version"]==3
          assert m["version"]=="1.6.4.3"
          assert "nativeMessaging" not in m["permissions"]
          assert "proxy" in m["permissions"]
          assert "webRequest" in m["permissions"]
          assert "webRequestAuthProvider" in m["permissions"]
          assert "privacy" in m["permissions"]
          assert m["host_permissions"]==["<all_urls>"]
          assert m["optional_host_permissions"]==["https://*/*"]
          PY
          node --check client/browser-extension/background.js
          node --check client/browser-extension/popup.js
          node client/browser-extension/test_verified_egress.cjs
          ! grep -R --line-number "sendNativeMessage\|nativeMessaging\|MakiaBrowserHost" client/browser-extension

      - name: Build Chrome Web Store ready package
        shell: bash
        run: |
          rm -rf dist-browser
          mkdir -p dist-browser/Makia-Browser-VPN-1.6.4.3
          cp client/browser-extension/background.js client/browser-extension/popup.js client/browser-extension/popup.html client/browser-extension/popup.css client/browser-extension/manifest.json dist-browser/Makia-Browser-VPN-1.6.4.3/
          (
            cd dist-browser/Makia-Browser-VPN-1.6.4.3
            zip -qr ../Makia-Browser-VPN-1.6.4.3.zip .
          )
          sha256sum dist-browser/Makia-Browser-VPN-1.6.4.3.zip | tee dist-browser/SHA256-Browser-VPN-1.6.4.3.txt
          printf 'browser_version=1.6.4.3\nserver_version=1.6.4\ncommit=%s\n' "$GITHUB_SHA" >dist-browser/BUILD-INFO-Browser.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Makia-Browser-VPN-1.6.4.3
          path: |
            dist-browser/Makia-Browser-VPN-1.6.4.3.zip
            dist-browser/SHA256-Browser-VPN-1.6.4.3.txt
            dist-browser/BUILD-INFO-Browser.txt
          if-no-files-found: error

      # Only a deliberately published GitHub Release may ship the extension.
      # Pushing to main must not silently overwrite an existing stable asset.
      - name: Publish browser package for approved GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          server_version="$(cat VERSION)"
          if [ "$RELEASE_TAG" != "v$server_version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match server VERSION $server_version"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            dist-browser/Makia-Browser-VPN-1.6.4.3.zip \
            dist-browser/SHA256-Browser-VPN-1.6.4.3.txt \
            dist-browser/BUILD-INFO-Browser.txt --clobber
