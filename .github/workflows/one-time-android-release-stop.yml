name: One-time Android Release Safety Stop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-android-release-stop.yml"

permissions:
  actions: write

jobs:
  stop-unapproved-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel unapproved Android release run 37968722870
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=37968722870
          state="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .status)"
          if [[ "$state" != "completed" ]]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel"
            echo "Requested cancellation of unapproved signed APK build $run_id"
          else
            echo "Signed APK build $run_id already completed; no action"
          fi
